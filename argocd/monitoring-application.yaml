apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 83.4.3
    helm:
      releaseName: kube-stack
      values: |
        prometheus:
          prometheusSpec:
            resources:
              requests:
                memory: "512Mi"
              limits:
                memory: "2Gi"
        grafana:
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "512Mi"
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                memory: "64Mi"
              limits:
                memory: "256Mi"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true