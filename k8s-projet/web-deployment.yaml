apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: kokafanta24/app-web:c6d2e67
        imagePullPolicy: Always
        # 🚀 NOUVEAU : Le garde-fou pour la RAM et le CPU
        resources:
          requests:
            memory: "64Mi"    # Très léger au démarrage
            cpu: "50m"
          limits:
            memory: "256Mi"   # Limite maximale pour éviter les fuites de mémoire
            cpu: "250m"
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          value: "mysql" # Se connecte au nom du service Kubernetes
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: LoadBalancer # Très bien pour K3s (utilise Klipper LB par défaut)
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80